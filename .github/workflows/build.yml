name: Build & release isolate

# Sur un tag poussé `v<version>-combined-<n>` : build (build.sh, Gate2 compris) sur le runner
# self-hosted `graal-isolate`, puis release de ce tag. À la main : build et Gate2 seulement.
# Runner, garde des jobs et publication : cf README, « Publier une version ».

on:
  push:
    tags: ['v*-combined-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, graal-isolate]
    timeout-minutes: 240 # attente de RAM comprise (LW_RAM_WAIT_MIN de runner/Dockerfile)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Avant un build de 10 à 60 min : le tag nomme la version de GraalVM construite.
      - name: Vérifier le tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          eval "$(grep '^GRAAL_VERSION=' build.sh)"
          [ -n "${GRAAL_VERSION:-}" ] || { echo "::error::GRAAL_VERSION introuvable dans build.sh"; exit 1; }
          [[ $TAG =~ ^v"$GRAAL_VERSION"-combined-[0-9]+$ ]] || { echo "::error::tag « $TAG » : v$GRAAL_VERSION-combined-<n> attendu (build.sh)"; exit 1; }

      # WORK=/work (image du runner) : arbre de build gardé d'un job à l'autre.
      - name: Build image isolate (build.sh) + Gate2
        run: nice -n 10 ./build.sh

      - name: Uploader le jar comme artefact de build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-isolate-resources-linux-amd64
          path: dist/js-isolate-resources-linux-amd64.jar
          retention-days: 14
          compression-level: 0 # jar déjà compressé
          overwrite: true # « Re-run all jobs »

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-isolate-resources-linux-amd64
          path: dist

      - name: Publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if out=$(gh release view "$TAG" 2>&1); then
            echo "::error::la release $TAG existe déjà (publiée, ou brouillon d'une publication interrompue : le supprimer) : on n'écrase jamais un jar publié"
            exit 1
          elif [[ $out != *"release not found"* ]]; then
            echo "::error::gh release view $TAG : $out"
            exit 1
          fi
          JAR=dist/js-isolate-resources-linux-amd64.jar
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          NOTES="Image isolate combinée js+python (GraalVM $(echo "$TAG" | sed 's/^v//; s/-combined-.*//')), instrument StatementCounter embarqué : $(git log -1 --format=%s). Gate2 validé en CI. Construite par build.sh sur ${GITHUB_SHA}. sha256 ${SHA}."
          gh release create "$TAG" "$JAR" --verify-tag --title "$TAG" --notes "$NOTES"
          echo "Release $TAG publiée. Ligne de libs/isolate-image.txt du générateur : \`$TAG $SHA\`" >> "$GITHUB_STEP_SUMMARY"
